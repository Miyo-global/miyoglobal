name: Publish scheduled posts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://www.miyoglobal.com/api/cron/publish
