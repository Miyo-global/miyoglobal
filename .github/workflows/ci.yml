name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miyo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/miyo
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      ADMIN_HOST: adm.localhost:3111
      ADMIN_ORIGIN: http://adm.localhost:3111
      SITE_URL: http://localhost:3111
      SEED_ADMIN_EMAIL: admin@miyoglobal.test
      SEED_ADMIN_PASSWORD: Ci-Test-Passw0rd-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Lighthouse budgets
        run: |
          pnpm start -p 3111 &
          npx wait-on http://localhost:3111/blog
          npx @lhci/cli@0.15.x autorun --config=lighthouserc.json
